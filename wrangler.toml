#:schema node_modules/wrangler/config-schema.json
name = "unifi-cloudflare-ddns"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Workers Logs
# Docs: https://developers.cloudflare.com/workers/observability/logs/workers-logs/
# Configuration: https://developers.cloudflare.com/workers/observability/logs/workers-logs/#enable-workers-logs
[observability]
enabled = true

# Automatically place your workloads in an optimal location to minimize latency.
# Docs: https://developers.cloudflare.com/workers/configuration/smart-placement/#smart-placement
[placement]
mode = "smart"

# When set, every DDNS update rewrites this record name instead of the
# hostname the UniFi controller sends. Required because the apex jacd.tech
# must never be rewritten (it is a proxied CNAME to the tunnel).
[vars]
TARGET_HOSTNAME = "home.jacd.tech"
